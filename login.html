{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container">
  <div class="card card-bb auth-card"><div class="card-body p-4">
    <h1 class="h3 text-center mb-1">Welcome back</h1>
    <p class="text-center text-muted">Log in to Book Bridge</p>
    <form method="post" class="needs-validation" novalidate>
      {{ csrf() }}
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required autocomplete="email" autofocus>
        <div class="invalid-feedback">Please enter a valid email.</div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
        <div class="invalid-feedback">Please enter your password.</div>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="remember" name="remember">
        <label class="form-check-label" for="remember">Remember me</label>
      </div>
      <button class="btn btn-bb w-100" type="submit">Login</button>
    </form>
    <p class="text-center mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div></div>
</div>
{% endblock %}
